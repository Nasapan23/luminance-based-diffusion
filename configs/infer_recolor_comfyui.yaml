backend: comfyui
run_name: recolor_vase
runs_root: runs/infer
seed: 2026
randomize_missing_seed: false

comfyui:
  base_url: "http://127.0.0.1:8188"
  client_id: "lbd-comfyui-client"
  timeout_sec: 60
  prompt_timeout_sec: 1800
  poll_interval_sec: 2
  upload_inputs: true

model:
  checkpoint_name: "YOUR_COLOR_SDXL_CHECKPOINT.safetensors"
  lora_name: "YOUR_VASE_RECOLOR_LORA.safetensors"
  lora_strength_model: 0.7
  lora_strength_clip: 0.7

defaults:
  prompt: "TARGET_OBJECT, detailed surface finish, painted decoration, glossy material, studio lighting, realistic reflections"
  negative_prompt: "blurry, low quality, desaturated, geometry distortions, unwanted handles, artifacts"
  steps: 35
  cfg: 6.0
  sampler_name: "euler"
  scheduler: "normal"
  denoise: 0.25
  batch_size: 1
  filename_prefix: "lbd/recolor"
  input_image: "data/experiments/inputs/grayscale_example.jpg"

jobs:
  - job_id: "recolor_001"
    seed: 2026
