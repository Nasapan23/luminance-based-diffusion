output_index_csv: data/base1k_real/meta/ingest_index.csv
threads: 16
sources:
  - id: coco
    type: coco
    enabled: true
    raw_dir: data/raw/coco
    local_globs:
      - images/**/*.jpg
      - images/**/*.jpeg
      - images/**/*.png
      - images/**/*.webp
    captions_json: annotations/captions_train2017.json
    fallback_caption: "real-world photo"
    download_enabled: false

  - id: places2
    type: places2
    enabled: true
    raw_dir: data/raw/places2
    local_globs:
      - images/**/*.jpg
      - images/**/*.jpeg
      - images/**/*.png
      - images/**/*.webp
    fallback_caption: "scene photograph"
    download_enabled: false

  - id: openimages
    type: openimages
    enabled: true
    raw_dir: data/raw/openimages
    local_globs:
      - images/**/*.jpg
      - images/**/*.jpeg
      - images/**/*.png
      - images/**/*.webp
    captions_csv: metadata/captions.csv
    fallback_caption: "open images photo"
    download_enabled: false
