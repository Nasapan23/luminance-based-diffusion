command:
  accelerate_binary: accelerate
  script: external/diffusers/examples/text_to_image/train_text_to_image_sdxl.py
  args:
    pretrained_model_name_or_path: "stabilityai/stable-diffusion-xl-base-1.0"
    train_data_dir: "data/base20k/gray/train"
    resolution: 1024
    train_batch_size: 1
    gradient_accumulation_steps: 4
    gradient_checkpointing: true
    mixed_precision: "fp16"
    learning_rate: "1e-6"
    checkpointing_steps: 200
    checkpoints_total_limit: 3
    # 1,800 steps keeps the training phase around 4-5 hours on a single RTX 4090
    # under a conservative ~8-10s/optimizer-step assumption for SDXL 1024 training.
    max_train_steps: 1800
    output_dir: "runs/train_sdxl_grayscale"

runtime:
  device: auto
  prefer_cuda: true
  allow_cpu_fallback: true
  mixed_precision:
    cuda: fp16
    cpu: "no"
  accelerate_launch_args: []
  env: {}
