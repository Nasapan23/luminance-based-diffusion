output_index_csv: data/vaze_bw/meta/ingest_index.csv
threads: 16
sources:
  - id: amphora
    type: local
    enabled: true
    raw_dir: data/vaze
    # Prefer per-image captions via image.txt sidecars or a local captions CSV/JSONL.
    local_globs:
      - "**/*.jpg"
      - "**/*.jpeg"
      - "**/*.png"
      - "**/*.webp"
      - "**/*.bmp"
      - "**/*.tif"
      - "**/*.tiff"
    fallback_caption: "ceramic vessel"
    download_enabled: false
