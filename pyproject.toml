[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lbd"
version = "0.1.0"
description = "Luminance-based diffusion data prep and training orchestration."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=6.0",
  "Pillow>=10.0",
  "requests>=2.31",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]
train = [
  "accelerate>=0.33",
  "datasets>=2.19",
  "diffusers>=0.29",
  "opencv-python>=4.9",
  "safetensors>=0.4",
  "transformers>=4.41",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
